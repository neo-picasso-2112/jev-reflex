[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-reflex"
version = "0.1.0"
description = "A neon arena shooter showcasing Jev's rapid typed decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pygame-ce>=2.5.3,<3",
  "python-dotenv>=1,<2",
  "typesafe-sdk>=0.7.1,<0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
jev-reflex = "jev_reflex.game:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_reflex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
